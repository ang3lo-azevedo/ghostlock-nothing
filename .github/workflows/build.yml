name: Build APK

on:
  push:
    branches:
      - main
      - spacewar
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: ndk-29.0.14206865-${{ runner.os }}

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Get version
        id: version
        run: echo "code=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/spacewar'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: v${{ steps.version.outputs.code }}
          body: Root My Nothing APK. CVE-2026-43499 (GhostLock) exploit for Nothing Phone (1).
          files: app/app/build/outputs/apk/release/*.apk
          make_latest: true
